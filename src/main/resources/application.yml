spring:
  application:
    name: campus-activity-platform

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    url: jdbc:mysql://localhost:3306/campus_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: As2004125
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.user.entity,com.campus.activity.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springfox:
  documentation:
    swagger-ui:
      enabled: true

server:
  port: 8080

app:
  pagination:
    default-page-size: 10
    max-page-size: 100
  comment:
    max-content-length: 1000
    max-reply-depth: 10
  activity:
    max-title-length: 200
    max-location-length: 500
    max-description-length: 5000
    max-participants: 100000
  search:
    default-limit: 10
    max-limit: 100
  file-upload:
    max-file-size: 10485760
    allowed-extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .pdf

jwt:
  secret: ${JWT_SECRET_KEY:campus-activity-platform-jwt-secret-key-2024}
  expiration: 86400000

logging:
  level:
    com.campus: debug
